# Files that must NOT be readable on the live site (11 Nov 2026, after a security check).
#
# The site publishes the whole repository folder, so until now anyone on the internet could open the database
# schema (/supabase/migrations/*.sql), the edge-function source (/supabase/functions/*), internal specs and
# reports (/docs, *.md, *.xlsx), the build tools and the source map. None of it holds a password or secret key
# (checked), but it shows an attacker exactly how the system is built and who is in it. The app itself only
# needs the .html pages, the page scripts (*.js), nexus.css, vendor/, assets/ and min/*.js - all of those stay.
#
# Each rule answers 404 even where a real file exists (force = true). Nothing else in this file changes how the
# site is built or published.

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

