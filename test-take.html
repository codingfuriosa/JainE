<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment — Jain Group</title>
<style>
  :root{--ink:#1e293b;--slate:#64748b;--line:#e2e8f0;--bg:#f8fafc;--red:#B52E25;--ok:#16a34a;--err:#dc2626;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 80px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--slate);font-size:14px;margin-bottom:24px}
  .q{border-top:1px solid var(--line);padding:20px 0}
  .q:first-child{border-top:none}
  .qprompt{font-weight:600;margin-bottom:12px;line-height:1.5}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
  .opt:hover{background:var(--bg)}
  .opt input{margin-top:3px}
  textarea{width:100%;min-height:110px;padding:12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;resize:vertical}
  .marks{font-size:12px;color:var(--slate);margin-top:6px}
  button{background:var(--red);color:#fff;border:none;border-radius:8px;padding:13px 22px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:none;color:var(--red);border:1px solid var(--red)}
  .msg{padding:16px;border-radius:8px;text-align:center;font-size:15px}
  .msg.err{background:#fef2f2;color:var(--err);border:1px solid #fecaca}
  .msg.ok{background:#f0fdf4;color:var(--ok);border:1px solid #bbf7d0}
  .loader{text-align:center;padding:60px 0;color:var(--slate)}
  .foot{text-align:center;color:var(--slate);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app"><div class="loader">Loading…</div></div>
  <div class="foot">Jain Group</div>
</div>
<script>
const FN_BASE = 'https://rkxsgtauigjrpcjkmccu.supabase.co/functions/v1';
const params = new URLSearchParams(location.search);
const attemptId = params.get('a') || '';
const app = document.getElementById('app');
let QUESTIONS = [];

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function call(fn, body){
  const r = await fetch(FN_BASE + '/' + fn, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  let data = {};
  try{ data = await r.json(); }catch(_){}
  return { ok: r.ok, data };
}

function renderError(msg){
  app.innerHTML = '<div class="msg err">' + esc(msg) + '</div>';
}

/* WHO THE PAPER IS FOR IS SHOWN, NOT ASKED.

   The candidate never types their address. Asking for it proved nothing - it is printed in the
   invitation they are holding, so it only re-proved they have the link - and storing what they
   typed would have put a second, possibly different address on the attempt, leaving two answers
   to "whose result is this". The result belongs to the candidate the attempt was minted for, and
   to nobody else.

   So it is fetched and displayed. Somebody opening a forwarded link sees immediately that the
   paper is addressed to someone else, which is the honest way to handle it: the link is the
   credential, and a person who has been given it can sit the test - but they can see, and we
   record, whose test it was. */
function renderIntro(who){
  /* A preview says so. Opened from JainE the attempt is minted under the previewer's own address,
     so the candidate box would have read "this test is for you" at somebody checking their own
     paper - true, but it reads as though they were the applicant. Worse, it gives no hint that the
     run will not be counted, which is the one thing the person checking needs to know. */
  const forLine = (who && who.is_preview)
    ? '<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 14px;margin:16px 0">'
      + '<div style="font-size:11.5px;color:#92400e;text-transform:uppercase;letter-spacing:.5px;font-weight:700">Preview</div>'
      + '<div style="font-size:13.5px;color:#78350f;margin-top:4px">You are sitting this yourself to check it. It is marked exactly the way a candidate paper is marked, and the marking appears under <b>Show previews</b> in Results — but it is not counted as anybody having taken the test.</div>'
      + '</div>'
    : (who && who.candidate_email)
    ? '<div style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:16px 0">'
      + '<div style="font-size:11.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.5px;font-weight:700">This test is for</div>'
      + '<div style="font-size:14.5px;font-weight:600;margin-top:3px">' + esc(who.candidate_email) + '</div>'
      + '<div style="font-size:12px;color:var(--slate);margin-top:6px">Your result is recorded against this address. If it is not yours, please do not continue.</div>'
      + '</div>'
    : '';
  const count = (who && who.question_count)
    ? '<div style="font-size:13px;color:var(--slate);margin-bottom:4px">' + who.question_count + ' questions</div>' : '';
  app.innerHTML =
    '<h1>' + esc((who && who.test_name) || 'Assessment') + '</h1>' +
    '<div class="sub">Jain Group</div>' +
    count +
    forLine +
    '<p style="color:var(--slate);font-size:14px;line-height:1.6">Nothing is recorded until you press Start — once you do, the questions appear and the clock begins. Answer every question you can, then press Submit. You cannot change your answers after submitting.</p>' +
    '<button onclick="startTest()">Start Test</button>';
}

function renderQuestions(info){
  QUESTIONS = info.questions;
  let html = '<h1>' + esc(info.test_name) + '</h1><div class="sub">Answer all questions, then submit.</div>';
  QUESTIONS.forEach((q, i) => {
    html += '<div class="q">';
    html += '<div class="qprompt">' + (i+1) + '. ' + esc(q.prompt) + '</div>';
    if (q.type === 'mcq') {
      (q.options || []).forEach((opt, oi) => {
        html += '<label class="opt"><input type="radio" name="q' + q.id + '" value="' + esc(opt) + '"><span>' + esc(opt) + '</span></label>';
      });
    } else {
      html += '<textarea id="ans_' + q.id + '" placeholder="Type your answer here..."></textarea>';
    }
    html += '<div class="marks">' + q.max_marks + ' mark' + (q.max_marks==1?'':'s') + '</div>';
    html += '</div>';
  });
  html += '<button onclick="submitTest()" style="margin-top:20px">Submit</button>';
  app.innerHTML = html;
}

function collectAnswers(){
  return QUESTIONS.map(q => {
    let val = '';
    if (q.type === 'mcq') {
      const el = document.querySelector('input[name="q' + q.id + '"]:checked');
      val = el ? el.value : '';
    } else {
      const el = document.getElementById('ans_' + q.id);
      val = el ? el.value : '';
    }
    return { question_id: q.id, answer_text: val };
  });
}

window.startTest = async function(){
  const btn = document.querySelector('#app button'); if (btn) { btn.disabled = true; btn.textContent = 'Starting…'; }
  const { ok, data } = await call('recruit-test-start', { attempt_id: attemptId });
  if (!ok || data.error) { renderError(data.error || 'Could not start this test.'); return; }
  if (data.status === 'submitted') { app.innerHTML = '<div class="msg ok">You have already submitted this test. Thank you.</div>'; return; }
  renderQuestions(data);
};

window.submitTest = async function(){
  const btn = document.querySelector('#app button'); if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }
  const answers = collectAnswers();
  const { ok, data } = await call('recruit-test-submit', { attempt_id: attemptId, answers });
  if (!ok || data.error) { renderError(data.error || 'Could not submit your answers. Please try again.'); return; }
  app.innerHTML = '<div class="msg ok">' + esc(data.message || 'Your test has been submitted. Thank you.') + '</div>';
};

(async function init(){
  if (!attemptId) { renderError('This test link is missing information and cannot be opened.'); return; }
  /* peek:true asks who the paper is for WITHOUT starting it - no status change, no clock. That is
     what lets this screen name the candidate before Start is pressed, while keeping the rule that
     started_at is stamped only when they actually begin. */
  const { ok, data } = await call('recruit-test-start', { attempt_id: attemptId, peek: true });
  if (!ok || (data && data.error)) { renderError((data && data.error) || 'This test link is not valid.'); return; }
  if (data && data.status === 'submitted') {
    app.innerHTML = '<div class="msg ok">You have already submitted this test. Thank you.</div>'; return;
  }
  renderIntro(data);
})();
</script>
</body>
</html>
