<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Booking Form · Dream Ananta · The Jain Group</title>
<!-- Digital Booking Form (2 Nov 2026): the Dream Ananta paper booking form, filled by the customer
     from anywhere. Public page - no login, no Supabase key; it posts to the booking-form-public edge
     function, which checks everything again. Logic in booking-form.js. -->
<link href="vendor/inter/inter.css?v=20261300" rel="stylesheet">
<style>
  /* A plain, professional look (3 Nov 2026): neutral greys, the Jain red only for actions and the
     chosen answer, thin borders, small corner rounding, no emoji or coloured icon tiles. */
  :root{--ink:#111827;--ink2:#374151;--slate:#6b7280;--line:#d9dce1;--line2:#e9ebee;--bg:#f4f5f7;--card:#fff;
    --brand:#b3171d;--brand-dark:#8f1217;--soft:#fbf3f3;--err:#b3171d;--ok:#15803d;--focus:rgba(179,23,29,.14)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:0 0 130px}
  svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  /* header: the two logos, the form's name, the addressee */
  .hd{background:#fff;padding:18px 20px 16px;border-bottom:1px solid var(--line)}
  .hd .logos{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line2)}
  .hd .logos img{display:block;height:38px;width:auto;max-width:47%;object-fit:contain}
  @media(max-width:380px){.hd .logos img{height:32px}}
  .hd h1{font-size:19px;margin:14px 0 2px;font-weight:700;letter-spacing:-.01em}
  .hd p{margin:0;color:var(--slate);font-size:13px}
  /* progress */
  .steps{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);padding:10px 20px 10px;border-bottom:1px solid var(--line)}
  .steps .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--slate);margin-bottom:7px}
  .steps .lbl b{color:var(--ink);font-weight:600;font-size:13.5px}
  .steps .bar{height:3px;background:var(--line2);border-radius:2px;overflow:hidden}
  .steps .bar i{display:block;height:100%;background:var(--brand);transition:width .3s}
  /* sections */
  .sec{background:var(--card);margin:16px 14px 0;border:1px solid var(--line);border-radius:10px;position:relative}
  .sh{padding:16px 18px 14px;border-bottom:1px solid var(--line2)}
  .sh h2{font-size:16px;margin:0;font-weight:600;letter-spacing:-.005em}
  .sh p{margin:3px 0 0;color:var(--slate);font-size:13px}
  .sb{padding:18px}
  .grid{display:flex;flex-direction:column;gap:18px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .pair>.f{min-width:0}
  .f{display:flex;flex-direction:column;gap:6px;min-width:0}
  .f>label{font-size:13px;font-weight:600;color:var(--ink2)}
  .f>label .opt{font-weight:400;color:var(--slate);font-size:12.5px}
  .f>label .req{color:var(--brand)}
  input[type=text],input[type=tel],input[type=email],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14.5px;background:#fff;color:var(--ink);min-height:44px;transition:border-color .15s,box-shadow .15s}
  input::placeholder,textarea::placeholder{color:#9ca3af}
  textarea{min-height:76px;resize:vertical}
  input:hover,textarea:hover{border-color:#bfc4cc}
  input:focus,textarea:focus{outline:none;border-color:var(--brand)!important;box-shadow:0 0 0 3px var(--focus)}
  .up{text-transform:uppercase}
  .bad input,.bad textarea,.bad .pick,.bad .upl label.pk,.bad .sigbox{border-color:var(--err)!important}
  .bad .chips .chip{border-color:#e6a9ab}
  .err{color:var(--err);font-size:12.5px;font-weight:500;display:none}
  .bad .err{display:block}
  .pre{display:flex;gap:8px}.pre .pick{width:120px;flex:none}
  /* choice options: compact radio pills, wrapping onto a second line when they do not fit */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 13px 8px 11px;font:inherit;font-size:14px;font-weight:500;color:var(--ink2);cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:border-color .15s,background .15s}
  .chip:hover{border-color:#bfc4cc}
  .chip:before{content:'';width:14px;height:14px;border-radius:50%;border:1.5px solid #b6bcc5;flex:none;box-sizing:border-box}
  .chip.on{border-color:var(--brand);background:var(--soft);color:var(--brand-dark)}
  .chip.on:before{border-color:var(--brand);background:radial-gradient(var(--brand) 40%,transparent 46%)}
  .chips.num .chip{min-width:42px;justify-content:center;padding:8px 12px}.chips.num .chip:before{display:none}
  /* dropdowns */
  .pick{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:44px;background:#fff;font:inherit;font-size:14.5px;color:var(--ink);cursor:pointer;text-align:left}
  .pick:hover{border-color:#bfc4cc}
  .pick .v{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick:after{content:'';width:7px;height:7px;border-right:1.7px solid var(--slate);border-bottom:1.7px solid var(--slate);transform:rotate(45deg);margin:-4px 3px 0 0;flex:none}
  .flag{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.1);background:#eee}
  .sheet-bg{position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:520px;max-height:78vh;border-radius:12px 12px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -10px 30px rgba(17,24,39,.15)}
  @media(min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:12px}}
  .sheet .st{padding:16px 18px 10px;font-weight:600;font-size:15.5px;display:flex;justify-content:space-between;align-items:center}
  .sheet .st button{border:none;background:none;border-radius:6px;width:32px;height:32px;font-size:20px;color:var(--slate);cursor:pointer}
  .sheet input{margin:0 16px 8px;width:calc(100% - 32px);font-size:14px!important;min-height:40px!important;padding:8px 12px!important}
  .sheet .ls{overflow:auto;padding:2px 8px 12px}
  .sheet .op{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:11px 12px;border-radius:6px;font:inherit;font-size:15px;text-align:left;cursor:pointer;color:var(--ink)}
  .sheet .op:hover{background:#f6f7f9}
  .sheet .op.on{background:var(--soft);font-weight:600;color:var(--brand-dark)}
  .sheet .op small{margin-left:auto;color:var(--slate)}
  /* rate per sq.ft. as Basic + PLC + FLC = Total, on one line */
  .rate{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:6px;align-items:end}
  .rate .f{gap:4px}.rate label.sub{font-size:12px;font-weight:500;color:var(--slate)}
  .rate .op{padding-bottom:12px;color:var(--slate);font-size:15px}
  .rate .sum{min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:8px;background:#f6f7f9;border:1px solid var(--line2);font-weight:600;font-size:14.5px}
  @media(max-width:520px){.rate{grid-template-columns:1fr 1fr;gap:10px}.rate .op{display:none}}
  /* applicants */
  .app{border:1px solid var(--line);border-radius:8px;padding:16px}
  .app+.app{margin-top:14px}
  .app .ah{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .app .ah b{font-size:15px;font-weight:600}
  .app .num{min-width:24px;height:24px;border-radius:6px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px;flex:none}
  .app .rm{margin-left:auto;background:#fff;border:1px solid var(--line);color:var(--brand-dark);border-radius:6px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;padding:6px 12px}
  .app .rm:hover{border-color:var(--brand)}
  .stack{display:flex;flex-direction:column;gap:18px}
  .grp{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);margin:20px 0 12px;display:flex;align-items:center;gap:10px}
  .grp:after{content:'';flex:1;height:1px;background:var(--line2)}
  .ah+.grp{margin-top:14px}
  .opt-d{margin-top:18px}.opt-d summary{font-size:14px;font-weight:500}.opt-d .opt{font-weight:400;color:var(--slate);font-size:12.5px;margin-left:4px}
  .btn{border:none;border-radius:8px;padding:12px 20px;font:inherit;font-size:15.5px;font-weight:600;cursor:pointer;min-height:48px}
  .btn.pri{background:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-dark)}
  .btn.sec2{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.add{width:100%;margin-top:14px;background:#fff;border:1px dashed #b6bcc5;color:var(--ink2);font-size:14.5px;font-weight:500}
  .btn.add:hover{border-color:var(--brand);color:var(--brand-dark)}
  .lnk{background:none;border:none;color:var(--brand-dark);font:inherit;font-weight:500;font-size:14px;cursor:pointer;padding:6px 0;text-align:left}
  .btn:disabled{opacity:.55}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  .nav .in{max-width:692px;margin:0 auto;display:flex;gap:10px}
  .nav .btn.sec2{min-width:96px}
  .nav .btn.pri{flex:1}
  .saved{font-size:11.5px;color:var(--slate);text-align:center;margin-top:6px}
  /* what is still missing */
  .miss{margin:16px 14px 0;border:1px solid #efc5c6;border-left:3px solid var(--brand);background:#fff;border-radius:8px;padding:12px 14px}
  .miss b{color:var(--ink);font-size:14px;font-weight:600}
  .miss ul{margin:6px 0 0;padding:0 0 0 18px;font-size:13.5px;color:var(--ink2)}
  .miss li{margin:3px 0;cursor:pointer;text-decoration:underline;text-decoration-color:#d3a0a2;text-underline-offset:2px}
  /* uploads */
  .upl{display:flex;flex-direction:column;gap:8px}
  .upl label.pk{display:flex;align-items:center;gap:12px;width:100%;border:1px dashed #b6bcc5;border-radius:8px;padding:13px 14px;cursor:pointer;background:#fafbfc;min-height:60px;color:var(--ink2)}
  .upl label.pk:hover{border-color:var(--brand);background:#fff}
  .upl label.pk .pi{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex:none;color:var(--slate)}
  .upl label.pk b{display:block;font-size:14px;font-weight:600;color:var(--ink)}.upl label.pk small{display:block;color:var(--slate);font-size:12.5px;margin-top:1px}
  .upl label.pk.more{min-height:46px;padding:8px 12px}.upl label.pk.more .pi{width:28px;height:28px}.upl label.pk.more .pi svg{width:16px;height:16px}
  .upl input{display:none}
  .file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:13.5px;width:100%;background:#fff}
  .file img{width:40px;height:40px;object-fit:cover;border-radius:5px;background:#eee}
  .file .pdf{width:40px;height:40px;border-radius:5px;background:#f3f4f6;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px}
  .file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .file button{border:none;background:none;color:var(--slate);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px}
  .file button:hover{color:var(--err);background:#f6f7f9}
  /* address suggestions */
  .ac{position:relative}
  .acl{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 28px rgba(17,24,39,.14);z-index:45;overflow:hidden}
  .acl button{display:block;width:100%;border:none;background:none;text-align:left;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line2);color:var(--ink)}
  .acl button:hover{background:#f6f7f9}
  .acl button:last-child{border-bottom:none}
  .acl button small{display:block;color:var(--slate);font-size:12px;margin-top:1px}
  .acl .src{font-size:10.5px;color:#9ca3af;padding:5px 14px;text-align:right}
  /* signature: a tap target on the page, the signing pad full screen */
  .sigbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:140px;border:1px dashed #b6bcc5;border-radius:8px;background:#fafbfc;cursor:pointer;font:inherit;color:var(--ink2);padding:14px}
  .sigbox:hover{border-color:var(--brand);background:#fff}
  .sigbox svg.i{width:26px;height:26px;color:var(--slate)}
  .sigbox b{font-size:15px;font-weight:600;color:var(--ink)}.sigbox small{color:var(--slate);font-size:12.5px}
  .sigbox.has{border-style:solid;border-color:var(--line);background:#fff}
  .sigbox.has img{max-width:100%;max-height:120px;object-fit:contain}
  .sigbox .again{font-size:13px;font-weight:500;color:var(--brand-dark);margin-top:4px}
  html.noscroll,html.noscroll body{overflow:hidden;height:100%;overscroll-behavior:none}
  .signer{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;touch-action:none}
  .sg-top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}
  .sg-top b{font-size:16px;font-weight:600;display:block}.sg-top small{color:var(--slate);font-size:12.5px}
  .sg-x{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:20px;color:var(--slate);cursor:pointer}
  .sg-area{position:relative;flex:1;margin:14px;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;touch-action:none}
  .sg-area canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .sg-line{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:1.5px solid #c9ced5;pointer-events:none}
  .sg-ph{position:absolute;left:0;right:0;bottom:calc(28% + 12px);text-align:center;color:#a8aeb7;font-size:16px;pointer-events:none}
  .sg-bot{display:flex;gap:10px;padding:0 14px calc(14px + env(safe-area-inset-bottom))}
  .sg-bot .btn{flex:1}
  /* terms */
  details.t{border:1px solid var(--line);border-radius:8px;margin-top:10px;background:#fff}
  details.t summary{padding:13px 14px;font-weight:500;font-size:14.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
  details.t summary::-webkit-details-marker{display:none}
  details.t summary:after{content:'';width:7px;height:7px;border-right:1.7px solid var(--slate);border-bottom:1.7px solid var(--slate);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .15s;flex:none}
  details.t[open] summary:after{transform:rotate(225deg);margin-top:2px}
  details.t ol{margin:0;padding:2px 18px 14px 36px;font-size:13.5px;color:var(--ink2);border-top:1px solid var(--line2);padding-top:12px}
  details.t li{margin-bottom:9px}
  .agree{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:8px;background:#fafbfc;cursor:pointer}
  .agree input{width:20px;height:20px;flex:none;accent-color:var(--brand);margin:1px 0 0}
  .agree b{font-weight:600}
  .switch{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fafbfc}
  .switch input{width:19px;height:19px;accent-color:var(--brand);margin:0;flex:none}
  .switch b{font-weight:500}
  /* review */
  .rv{width:100%;border-collapse:collapse;font-size:14px}
  .rv td{padding:8px 0;border-bottom:1px solid var(--line2);vertical-align:top}
  .rv td:first-child{color:var(--slate);width:42%;padding-right:12px}
  .rvh{display:flex;justify-content:space-between;align-items:center;margin-top:22px;margin-bottom:2px}
  .rvh:first-child{margin-top:0}
  .rs{margin-top:22px}.rs:first-child{margin-top:0}.rs .rvh{margin-top:0}
  .rvh h3{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--slate)}
  .rvh button{background:#fff;border:1px solid var(--line);color:var(--ink2);border-radius:6px;font:inherit;font-weight:500;font-size:13px;cursor:pointer;padding:5px 14px}
  .rvh button:hover{border-color:var(--brand);color:var(--brand-dark)}
  .done{text-align:center;padding:36px 20px}
  .done .ok{width:56px;height:56px;border-radius:50%;border:1.5px solid #bfe3cc;color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .done .ok svg{width:28px;height:28px;stroke-width:2.2}
  .done h2{font-weight:600}
  .done .ref{font-size:22px;font-weight:700;letter-spacing:.5px;margin:8px 0 14px;color:var(--ink)}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .words{font-size:12.5px;color:var(--slate)}
  .toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:70;max-width:90%;text-align:center}
  /* on a phone: less frame, more room for the fields */
  @media(max-width:520px){.sec{margin:12px 10px 0}.sb{padding:14px}.sh{padding:14px 14px 12px}.app{padding:12px}.steps{padding:10px 14px}.hd{padding:16px 14px 14px}}
  .hint{font-size:12.5px;color:var(--slate);line-height:1.4}
  .steps .sd{display:none}
  /* DESKTOP (6 Nov 2026): every section is full width, one under the other. To keep the page short the fields sit in rows
     on a six-column grid, each as wide as what goes in it (a PIN narrow, a name wide), and a section's title and help
     are one line. Phones are untouched (the s2/s3/s4/s6 and o1.. classes do nothing there). */
  @media(min-width:1000px){
    body{font-size:16px}
    .wrap{max-width:1120px}
    /* header in one line: logo, the form's name and addressee, project logo */
    .hd{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:24px;padding:12px 28px}
    .hd .logos{display:contents}
    .hd .logos img{height:40px;max-width:none;grid-row:1/3}
    .hd .logos img:first-child{grid-column:1}
    .hd .logos img.proj{grid-column:3}
    .hd h1{grid-column:2;grid-row:1;margin:0;text-align:center;font-size:20px}
    .hd p{grid-column:2;grid-row:2;text-align:center;font-size:13.5px}
    /* step bar in one line: name, what it is for, step count, then the bar */
    .steps{display:grid;grid-template-columns:auto 1fr auto;column-gap:16px;align-items:baseline;padding:9px 28px 10px}
    .steps .lbl{display:contents}
    .steps .lbl b{grid-column:1;grid-row:1;font-size:17px}
    .steps .sd{display:block;grid-column:2;grid-row:1;margin:0;font-size:14px;color:var(--slate)}
    .steps .lbl span{grid-column:3;grid-row:1}
    .steps .bar{grid-column:1/-1;grid-row:2;margin-top:7px}
    #app{display:block;padding:0 14px;margin-top:16px}
    #app>.sec{margin:0 0 14px}
    #missing .miss{margin:16px 14px 0}
    .sh{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 14px;padding:13px 22px 11px}
    .sh h2{font-size:18px}.sh p{margin:0;font-size:14px}
    .sb{padding:16px 22px 20px}
    .f>label{font-size:14px}
    input[type=text],input[type=tel],input[type=email],input[type=date],textarea{font-size:16px;min-height:46px}
    textarea{min-height:62px}
    .pick{font-size:16px;min-height:46px}
    .pre .pick{width:112px;padding-left:10px;padding-right:8px;gap:8px}
    .chip{font-size:15px;min-height:42px}
    .chips.num .chip{min-width:38px;padding:8px 6px}
    .hint{font-size:13px}
    .rv{font-size:15px}
    /* the grid: six columns; a field says how many it takes (s2 = a third, s3 = half, s4 = two thirds, s6 = the row) */
    .sb .stack,.sb .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px 16px;align-items:start}
    .sb .stack>*,.sb .grid>*,.sb .pair>*{grid-column:span 3;min-width:0}
    .pair{display:contents}
    .sb .s2{grid-column:span 2}.sb .s3{grid-column:span 3}.sb .s4{grid-column:span 4}.sb .s6{grid-column:1/-1}
    .sb .o1{order:1}.sb .o2{order:2}.sb .o3{order:3}.sb .o4{order:4}.sb .o5{order:5}.sb .o6{order:6}.sb .o7{order:7}.sb .o8{order:8}.sb .o9{order:9}
    /* applicants: one under the other, a thin line between */
