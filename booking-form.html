<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12141c">
<title>Booking Form · Dream Ananta · The Jain Group</title>
<!-- Digital Booking Form (2 Nov 2026): the Dream Ananta paper booking form, filled by the customer
     from anywhere. Public page - no login, no Supabase key; it posts to the booking-form-public edge
     function, which checks everything again. Logic in booking-form.js. -->
<link href="vendor/inter/inter.css?v=20261300" rel="stylesheet">
<style>
  :root{--ink:#1a1d24;--slate:#646a78;--line:#e4e1db;--bg:#f2efe9;--brand:#9c1420;--brand-dark:#7a0f19;--soft:#fbf3f3;--err:#b3261e;--ok:#166d4a;--card:#fff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  .wrap{max-width:760px;margin:0 auto;padding:0 0 120px}
  /* header */
  .hd{background:#12141c;color:#fff;padding:22px 20px 18px;position:relative}
  .hd:after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--brand)}
  .hd .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .hd .jg{font-weight:800;letter-spacing:2px;font-size:15px}
  .hd .jg small{display:block;font-size:9.5px;letter-spacing:2.4px;color:#9aa0ad;font-weight:600;margin-top:2px}
  .hd .pj{text-align:right;font-weight:800;letter-spacing:3px;font-size:21px;color:#b7c97a}
  .hd .pj small{display:block;font-size:9.5px;letter-spacing:1.5px;color:#9aa0ad;font-weight:600}
  .hd h1{font-size:19px;margin:16px 0 3px;font-weight:700}
  .hd p{margin:0;color:#b8bcc6;font-size:13px}
  /* progress */
  .steps{position:sticky;top:0;z-index:20;background:rgba(242,239,233,.96);backdrop-filter:blur(6px);padding:10px 14px 9px;border-bottom:1px solid var(--line)}
  .steps .bar{height:5px;background:#e3ded5;border-radius:4px;overflow:hidden}
  .steps .bar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .3s}
  .steps .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--slate);margin-top:6px;font-weight:600}
  .steps .lbl b{color:var(--ink)}
  /* cards */
  .sec{background:var(--card);margin:14px 12px 0;border-radius:14px;padding:18px 16px;box-shadow:0 1px 2px rgba(20,15,10,.05),0 6px 18px rgba(20,15,10,.04)}
  .sec h2{font-size:16.5px;margin:0 0 4px;font-weight:700}
  .sec .hint{color:var(--slate);font-size:13px;margin:0 0 14px}
  .sec h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--slate);margin:20px 0 10px;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 12px}
  .full{grid-column:1/-1}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  .f{display:flex;flex-direction:column;gap:6px;min-width:0}
  .f>label{font-size:13px;font-weight:600;color:#3d424e}
  .f>label .opt{font-weight:500;color:var(--slate);font-size:12px}
  .f>label .req{color:var(--brand)}
  input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;font-family:inherit;font-size:16px;background:#fff;color:var(--ink);min-height:48px}
  textarea{min-height:70px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(156,20,32,.1)}
  .up{text-transform:uppercase}
  .bad input,.bad select,.bad textarea,.bad .chips,.bad .pad{border-color:var(--err)!important}
  .err{color:var(--err);font-size:12.5px;font-weight:600;display:none}
  .bad .err{display:block}
  .pre{display:flex;gap:8px}.pre select{width:118px;flex:none}
  /* choice chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;border:1.5px solid transparent;border-radius:12px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font:inherit;font-size:14.5px;font-weight:600;color:#3d424e;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:7px}
  .chip:before{content:'';width:16px;height:16px;border-radius:50%;border:2px solid #c9c4bb;flex:none}
  .chip.on{border-color:var(--brand);background:var(--soft);color:var(--brand-dark)}
  .chip.on:before{border-color:var(--brand);background:radial-gradient(var(--brand) 45%,transparent 50%)}
  .chip .tag{font-size:10.5px;font-weight:700;background:#efe9df;color:var(--slate);border-radius:6px;padding:1px 6px}
  /* applicant cards */
  .app{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;background:#fffdfb}
  .app .ah{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .app .ah b{font-size:15px}
  .app .num{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;flex:none}
  .app .rm{margin-left:auto;background:none;border:none;color:var(--err);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:8px}
  .btn{border:none;border-radius:12px;padding:14px 20px;font:inherit;font-size:15.5px;font-weight:700;cursor:pointer;min-height:50px}
  .btn.pri{background:var(--brand);color:#fff}.btn.pri:active{background:var(--brand-dark)}
  .btn.sec2{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn.add{width:100%;margin-top:14px;background:#fff;border:1.5px dashed #c9a6a6;color:var(--brand-dark)}
  .btn:disabled{opacity:.55}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(20,15,10,.06)}
  .nav .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
  .nav .btn.pri{flex:1}
  .saved{font-size:11.5px;color:var(--slate);text-align:center;margin-top:6px}
  /* uploads */
  .upl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .upl label.pick{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed #c9c4bb;border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;cursor:pointer;background:#fff;min-height:48px}
  .upl input{display:none}
  .file{display:flex;align-items:center;gap:8px;background:#f4f1ec;border-radius:10px;padding:6px 8px 6px 6px;font-size:13px;max-width:100%}
  .file img{width:42px;height:42px;object-fit:cover;border-radius:7px;background:#ddd}
  .file .pdf{width:42px;height:42px;border-radius:7px;background:#e7dcdc;color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
  .file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
  .file button{border:none;background:none;color:var(--err);font-size:18px;cursor:pointer;padding:4px 6px}
  /* signature */
  .pad{position:relative;border:1.5px solid var(--line);border-radius:12px;background:#fff;touch-action:none;overflow:hidden}
  .pad canvas{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair}
  .pad .line{position:absolute;left:18px;right:18px;bottom:40px;border-bottom:1.5px dashed #cfc9bf;pointer-events:none}
  .pad .ph{position:absolute;left:0;right:0;top:40%;text-align:center;color:#b9b3a8;font-size:15px;pointer-events:none}
  .pad .x{position:absolute;right:8px;top:8px;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  /* terms */
  details.t{border:1.5px solid var(--line);border-radius:12px;margin-top:10px;background:#fff}
  details.t summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
  details.t summary:after{content:'+';font-size:20px;color:var(--slate)}
  details.t[open] summary:after{content:'–'}
  details.t ol{margin:0;padding:0 16px 14px 34px;font-size:13.5px;color:#3d424e}
  details.t li{margin-bottom:9px}
  .agree{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
  .agree input{width:24px;height:24px;flex:none;accent-color:var(--brand);margin:0}
  .note{background:#fff8e6;border:1px solid #f1d58a;color:#6b5210;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
  /* review */
  .rv{width:100%;border-collapse:collapse;font-size:14px}
  .rv td{padding:7px 0;border-bottom:1px solid #f0ece6;vertical-align:top}
  .rv td:first-child{color:var(--slate);width:42%;padding-right:10px}
  .rvh{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
  .rvh h3{margin:0}
  .rvh button{background:none;border:none;color:var(--brand);font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;padding:6px}
  .done{text-align:center;padding:34px 18px}
  .done .ok{width:64px;height:64px;border-radius:50%;background:#e3f3ea;color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px}
  .done .ref{font-size:24px;font-weight:800;letter-spacing:1px;margin:10px 0;color:var(--brand-dark)}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .words{font-size:12.5px;color:var(--ok);font-weight:600}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1a1d24;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:50;max-width:90%;text-align:center}
  @media print{.steps,.nav,.btn,.rvh button{display:none!important}.sec{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="row">
      <div class="jg">JAIN GROUP<small>CARING FOR YOUR DREAMS</small></div>
      <div class="pj">ANANTA<small>at Dream Gurukul</small></div>
    </div>
    <h1>Booking Application Form</h1>
    <p>To Dream Gateway Hotels Ltd., 44/2A Hazra Road, Kolkata – 700 019</p>
  </div>
  <div class="steps" id="steps"></div>
  <form id="app" autocomplete="on" novalidate onsubmit="return false"></form>
</div>
<div class="nav" id="nav"></div>
<script src="booking-form.js?v=20261102"></script>
</body>
</html>
