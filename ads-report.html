<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Campaign Report · The Jain Group</title>
<!-- PUBLIC CAMPAIGN REPORT (17 Nov 2026, Ayush). Anyone with the link can open it; it holds no JainE code and no database
     key. It asks the campaign-share function for the rows Campaign Analytics shows, with the key in the link (#k=...), and
     lays them out the same way: project > Google / Facebook > campaign > ad set > ad, the same columns, the same ad cards.
     While sharing is switched off in Campaign Analytics, or the key is wrong, it shows nothing. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0f172a;--slate:#64748b;--line:#e5e7eb;--bg:#f6f7fb;--card:#fff;--brand:#2563eb}
  *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
  .wrap{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
  h1{margin:0 0 4px;font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}.sub{color:var(--slate);font-size:12.5px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
  .bar select{height:36px;padding:0 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;font-weight:600;background:#fff}
  .cr{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--slate);flex-wrap:wrap}.cr input{height:34px;padding:0 8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;color:var(--ink)}
  .stg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}.st{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;font-size:12.5px;font-weight:600;color:#334155;cursor:pointer;border-right:1px solid var(--line)}.st:last-child{border-right:0}.st input{margin:0;accent-color:var(--brand)}.st.on{background:#eef4ff;color:#1d4ed8}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--slate);background:#f8fafc;padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl th:first-child,.tbl td:first-child{text-align:left}.tbl td{padding:11px 12px;border-bottom:1px solid #eef1f4;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:#f8fafc}.tbl tr.on>td{background:#eef4ff}
  .tbl tr.row td:first-child{font-weight:700}.caret{color:#94a3b8;font-size:11px;margin-right:8px;width:10px;display:inline-block}
  .tbl tr.l1 td,.tbl tr.l2 td,.tbl tr.l3 td{padding-top:7px;padding-bottom:7px;font-size:12.5px}
  .tbl tr.l1 td:first-child{padding-left:34px;font-weight:650}.tbl tr.l2 td:first-child{padding-left:58px;font-weight:500}
  .tbl tr.l1 td{background:#fcfcfd}.tbl tr.l2 td{background:#fafbfc}
  .tbl tr.none td{color:var(--slate);font-size:12px;text-align:left}
  .tbl tr.tot td{font-weight:700;background:#f1f5f9;border-top:2px solid #cbd5e1;border-bottom:0}
  .tbl th.crm{color:#6d28d9;background:#f5f3ff}
  .sec{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;margin-top:14px}
  .sec .tbl tr.l0 td{font-size:13px;padding-top:9px;padding-bottom:9px}.sec .tbl tr.l0 td:first-child{font-weight:600}
  .nm{width:340px;min-width:340px;max-width:340px}.nmx{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ssub{font-size:10.5px;color:#94a3b8;margin-top:1px;white-space:nowrap}
  .na{color:#94a3b8}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
  .tg{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;background:#f1f5f9;color:#475569;margin-left:4px}
  /* ad cards: every card the same height, the picture cropped to a fixed 190 px */
  .ads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 12px 12px}@media(max-width:900px){.ads{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .ad{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;display:flex;flex-direction:column;cursor:pointer}
  .ad:hover{box-shadow:0 8px 22px rgba(15,23,42,.1)}
  .pic{position:relative;height:190px;background:#f1f5f9;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover;display:block}
  .txt{padding:14px;font-size:13px;line-height:1.45;background:#fff;height:190px;overflow:hidden;border-bottom:1px solid var(--line)}.txt .h{color:#1a0dab;font-size:14.5px;font-weight:600}.txt .d{color:#4d5156;margin-top:6px}.txt .sp{font-size:11px;font-weight:700;margin-bottom:4px}
  .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
  .play:after{content:"";border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
  .ad .an{padding:9px 12px 0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px}.t-on{background:#dcfce7;color:#166534}.t-off{background:#f1f5f9;color:#475569}
  .m{padding:8px 12px 12px;font-size:11.5px;display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 8px;margin-top:auto}.m span{color:var(--slate)}.m b{text-align:right;white-space:nowrap}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 0}.tab{border:0;background:none;padding:10px 16px;font:inherit;font-weight:600;font-size:14px;color:var(--slate);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
  .ahead{font-weight:700;font-size:13.5px;margin:16px 14px 10px}.ahead span{font-weight:500;color:var(--slate);font-size:12px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;height:34px;padding:0 14px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .ov{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}.ov.show{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:980px;width:100%;max-height:92vh;overflow:auto}
  .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}.mh h3{margin:0;font-size:15px}.x{border:0;background:none;font-size:24px;cursor:pointer;color:var(--slate)}
  .mb{display:flex;gap:18px;flex-wrap:wrap;padding:16px 18px}.media{flex:1 1 320px;min-width:280px;height:360px;background:#f1f5f9;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .media.tall{height:560px}.media img{max-width:100%;max-height:100%;object-fit:contain}.media iframe,.media video{width:100%;height:100%;border:0}
  .det{flex:1 1 300px;min-width:270px}.det table{width:100%;border-collapse:collapse;font-size:12.5px}.det td{padding:7px 4px;border-bottom:1px solid #f1f5f9}.det td:last-child{text-align:right;font-weight:600}
  .lbl{font-size:11.5px;color:var(--slate);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 5px}
  .words{white-space:pre-wrap;font-size:13px;line-height:1.55;max-height:160px;overflow:auto}
  .off{max-width:520px;margin:18vh auto;text-align:center;color:var(--slate)}.off b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
  .loading{padding:60px;text-align:center;color:var(--slate)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading…</div></div>
<div class="ov" id="ov" onclick="if(event.target===this)R.close()"><div class="modal" id="mod"></div></div>
<script>
var R=(function(){
  'use strict';
  var FN='https://rkxsgtauigjrpcjkmccu.supabase.co/functions/v1/campaign-share';
  var key=(location.hash.match(/k=([A-Za-z0-9]+)/)||[])[1]||'';
  var S={tab:'campaigns',period:'last_30d',st:'both',open:null,plat:null,camp:null,set:null,show:12,ax:{ad:null,camp:null},axShow:50}, D=null, X=null;
  var PL={google:{name:'Google',color:'#ea4335',res:'Leads',per:'Cost per lead',set:'Ad group',sets:'Ad groups'},meta:{name:'Facebook',color:'#1877f2',res:'Results',per:'Cost per result',set:'Ad set',sets:'Ad sets'}};
  var esc=function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var NA='<span class="na">NA</span>';
  var money=function(x){ return x==null||!isFinite(x)?NA:'₹'+Math.round(x).toLocaleString('en-IN'); };
  var n0=function(x){ return x==null||!isFinite(x)?NA:Math.round(x).toLocaleString('en-IN'); };
  var pct=function(x){ return x==null||!isFinite(x)?NA:x.toFixed(2)+'%'; };
  var pc0=function(x){ return x==null||!isFinite(x)?NA:x.toFixed(0)+'%'; };
  var dmy=function(s){ var x=String(s).split('-'); return x[2]+'/'+x[1]+'/'+x[0]; };
  var app=document.getElementById('app');
  function off(){ app.innerHTML='<div class="off"><b>This report is not available</b>The link has been switched off or is not valid.</div>'; }
  function call(b){ b.k=key; return fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){ return r.json(); }); }
  function load(){
    if(!key){ off(); return; }
    if(D) app.style.opacity='.55'; else app.innerHTML='<div class="loading">Loading…</div>';
    call(S.period==='custom'?{period:'custom',from:S.from,to:S.to}:{period:S.period}).then(function(d){ app.style.opacity=''; if(!d||d.off||d.error||!d.camps){ off(); return; } D=d; prep(); paint(); }).catch(function(){ app.style.opacity=''; off(); });
  }
  // lookups and the Active / Inactive / Both choice
  function prep(){
    X={camp:{},wa:{}}; D.camps.forEach(function(c){ X.camp[c.id]=c; });
    D.camps.forEach(function(c){ if(c.pl==='meta'&&c.live&&c.lead) X.wa[c.project]=1; });
  }
  var ok=function(live){ return S.st==='both'||(S.st==='active')===!!live; };
  var act=function(x){ return (x.spend||0)>0||(x.impressions||0)>0||(x.clicks||0)>0||(x.results||0)>0; };
  var adLive=function(a){ var i=D.adinfo[a.id]||{}, c=X.camp[a.cid]||{}, s=a.sid?D.sets[a.sid]||{}:null; return !!i.live&&!!c.live&&(!s||!!s.live); };
  function camps(){ return D.camps.filter(function(c){ return ok(c.live); }); }
  function crmOk(x){ if(S.st==='both') return true; if(x.untied) return false; if(x.wa) return ok(!!X.wa[x.project]); var c=X.camp[x.cid]; return !!c&&ok(c.live); }
  // a campaign's budget: none for a switched-on campaign with no activity in the last 3 days (not spending)
  var bud=function(c){ return c.budget==null||(c.live&&!c.active3)?null:c.budget; };
  function sum(rows,crmRows){
    var t={spend:0,leads:0,lspend:0,clicks:0,impr:0,bud:null,crm:{leads:0,ql:0,sv:0,booked:0,lost:0}};
    rows.forEach(function(c){ t.spend+=c.spend; t.clicks+=c.clicks; t.impr+=c.impressions; if(c.pl==='google'||c.lead){ t.leads+=c.results||0; t.lspend+=c.spend; }
      if(act(c)&&c.budget!==undefined){ var b=bud(c); if(b!=null) t.bud=(t.bud||0)+b; } });
    (crmRows||[]).forEach(function(x){ ['leads','ql','sv','booked','lost'].forEach(function(k){ t.crm[k]+=x[k]||0; }); });
    return t;
  }
  function cols(t,lead,hasCrm){ var c=t.crm||{};
    var crmCell=function(v){ return '<td class="crmc">'+(hasCrm?n0(v):NA)+'</td>'; };
    return '<td><b>'+money(t.spend)+'</b></td><td>'+(lead===false?n0(t.res)+'<span class="tg">not leads</span>':n0(t.leads))+'</td>'
      +crmCell(c.leads)+crmCell(c.ql)+crmCell(c.sv)+crmCell(c.booked)+crmCell(c.lost)
      +'<td>'+money(t.leads?(t.lspend||t.spend)/t.leads:null)+'</td><td class="crmc">'+(hasCrm?money(c.leads&&t.spend!=null?t.spend/c.leads:null):NA)+'</td><td>'+(hasCrm?money(c.ql&&t.spend!=null?t.spend/c.ql:null):NA)+'</td>'
      +'<td>'+n0(t.clicks)+'</td><td>'+pct(t.impr?t.clicks/t.impr*100:null)+'</td>'
      +'<td>'+(hasCrm?pc0(c.leads?c.ql/c.leads*100:null):NA)+'</td><td>'+(hasCrm?pc0(c.ql?c.sv/c.ql*100:null):NA)+'</td>'; }
  function head(name,res,per){ return '<tr><th class="nm">'+name+'</th><th>Daily budget</th><th>Spend</th><th>'+res+'</th><th class="crm">CRM leads</th><th class="crm">QL</th><th class="crm">SV</th><th class="crm">Booked</th><th class="crm">Lost</th><th>'+per+'</th><th class="crm" title="Spend per CRM lead">CRM CPL</th><th class="crm">CPQL</th><th>Clicks</th><th>CTR</th><th class="crm">QL%</th><th class="crm">QL to SV %</th></tr>'; }
  var caret=function(on){ return '<span class="caret">'+(on?'▾':'▸')+'</span>'; };
  var dot=function(live,st){ return '<span class="dot" style="background:'+(live?'#16a34a':'#dc2626')+'" title="'+esc(live?'Enabled':(st||'Stopped'))+'"></span>'; };
  var bcell=function(v,sub){ return '<td>'+(v==null?NA:money(v))+(sub?'<div class="ssub">'+sub+'</div>':'')+'</td>'; };
  var nm=function(lead,text){ return '<td class="nm"><span class="nmx" title="'+esc(text)+'">'+lead+esc(text)+'</span></td>'; };
  function paint(){
    var C=camps(), crm=D.crm.filter(crmOk);
    // 25 Nov 2026 (Ayush): a Custom choice too - From / To dates and Apply
    var periods=[['last_7d','Last 7 days'],['last_30d','Last 30 days'],['this_month','This month'],['last_month','Last month'],['last_90d','Last 90 days'],['custom','Custom']];
    var today=new Date(Date.now()+330*60000).toISOString().slice(0,10);
    var cust=S.period==='custom'||S.pick?'<span class="cr">From <input type="date" id="cf" min="2024-01-01" max="'+today+'" value="'+esc(S.from||D.from)+'"> To <input type="date" id="ct" min="2024-01-01" max="'+today+'" value="'+esc(S.to||D.to)+'"> <button class="btn" id="capply" style="background:var(--brand);color:#fff;border-color:var(--brand)">Apply</button></span>':'';
    var h='<h1>Campaign Report</h1><div class="sub">The Jain Group · Google and Facebook ads · '+esc(dmy(D.from))+' – '+esc(dmy(D.to))+'</div>'
      // the same two tabs as JainE's Campaign Analytics: Campaigns (top down) and Ads (from the ad up)
      +'<div class="tabs">'+[['campaigns','Campaigns'],['ads','Ads']].map(function(o){ return '<button class="tab'+(S.tab===o[0]?' on':'')+'" data-tab="'+o[0]+'">'+o[1]+'</button>'; }).join('')+'</div>'
      +'<div class="bar"><select id="per">'+periods.map(function(o){ return '<option value="'+o[0]+'"'+((S.pick?'custom':S.period)===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select>'+cust
      +'<span class="stg">'+[['active','Active'],['inactive','Inactive'],['both','Both']].map(function(o){ return '<label class="st'+(S.st===o[0]?' on':'')+'"><input type="radio" name="st" value="'+o[0]+'"'+(S.st===o[0]?' checked':'')+'>'+o[1]+'</label>'; }).join('')+'</span></div>';
    var projs=D.projects.slice().map(function(p){ return {p:p,t:sum(C.filter(function(c){ return c.project===p; }),[])}; }).sort(function(a,b){ return b.t.spend-a.t.spend||a.p.localeCompare(b.p); });
    var rows='';
    projs.forEach(function(o){ var p=o.p, on=S.open===p, pc=C.filter(function(c){ return c.project===p; }), pk=crm.filter(function(x){ return x.project===p; });
      var t=sum(pc,pk); rows+='<tr class="row'+(on?' on':'')+'" data-open="'+esc(p)+'"><td>'+caret(on)+esc(p)+'</td>'+bcell(t.bud)+cols(t,null,true)+'</tr>';
      if(!on) return;
      ['google','meta'].forEach(function(pl){ if(!D.hasAcc[p+'|'+pl]) return; var W=PL[pl], c2=pc.filter(function(c){ return c.pl===pl; }), k2=pk.filter(function(x){ return x.pl===pl; }), tt=sum(c2,k2);
        rows+='<tr class="row l1'+(S.plat===pl?' on':'')+'" data-plat="'+pl+'"><td><span class="caret"></span><span style="color:'+W.color+';font-weight:800">●</span> '+W.name+'</td>'+bcell(tt.bud)+cols(tt,null,true)+'</tr>'; });
    });
    var T=sum(C,crm);
    rows+='<tr class="tot"><td>Total</td>'+bcell(T.bud)+cols(T,null,true)+'</tr>';
    h+='<div class="card"><table class="tbl"><thead>'+head('Project','Leads','Cost per lead')+'</thead><tbody>'+rows+'</tbody></table></div>';
    if(S.open&&S.plat) h+=S.tab==='ads'?adsSection(C,crm):section(C,crm);
    h+='<div class="sub" style="margin-top:22px">Figures as reported by Google and Meta; CRM figures are the leads left after the CRM’s filtering. NA = not available.</div>';
    app.innerHTML=h;
    if(R._scroll){ R._scroll=false; var s=document.getElementById('below'); if(s) s.scrollIntoView({block:'start'}); }
  }
  /* THE ADS TAB, as in JainE: every ad of the open project and platform is one row (copies - same name, new id - counted
     together); its arrow opens the campaigns it runs in, a campaign the ad sets / ad groups it runs in there. Each row shows
     its own figures. The picture opens the ad. */
  function adsSection(C,crm){
    var p=S.open, pl=S.plat, W=PL[pl], AX=S.ax;
    var keyOf=function(a){ return a.pl+':'+String((D.adinfo[a.id]||{}).name||a.id).trim().toLowerCase().replace(/\s+/g,' '); };
    var by={}, ads=[];
    D.adrows.forEach(function(a){ var c=X.camp[a.cid]; if(!c||c.project!==p||a.pl!==pl||!act(a)||!ok(adLive(a))) return;
      var k=keyOf(a), m=by[k]; if(!m){ m=by[k]={k:k,pl:pl,id:a.id,cid:a.cid,sid:'',spend:0,results:null,clicks:0,impressions:0,rows:[],ids:{},top:-1}; ads.push(m); }
      m.spend+=a.spend; m.clicks+=a.clicks; m.impressions+=a.impressions; if(a.results!=null) m.results=(m.results||0)+a.results; m.rows.push(a); m.ids[a.id]=1;
      if(a.spend>m.top){ m.top=a.spend; m.id=a.id; m.cid=a.cid; } });
    ads.sort(function(x,y){ return y.spend-x.spend; });
    var crmOf=function(ids){ var t=null; Object.keys(ids).forEach(function(id){ var c=D.crmAd[id]; if(!c) return; t=t||{leads:0,ql:0,sv:0,booked:0,lost:0}; ['leads','ql','sv','booked','lost'].forEach(function(k){ t[k]+=c[k]||0; }); }); return t; };
    var setTot=function(sid){ var x={spend:0,results:null,clicks:0,impr:0}; D.adrows.forEach(function(a){ if(a.sid!==sid) return; x.spend+=a.spend; x.clicks+=a.clicks; x.impr+=a.impressions; if(a.results!=null) x.results=(x.results||0)+a.results; }); return x; };
    R._axk=[]; R._axads=[]; var rows='';
    ads.slice(0,S.axShow).forEach(function(a){
      var e=D.adinfo[a.id]||{}, on=AX.ad===a.k, ki=R._axk.push(a.k)-1, ai=R._axads.push(a)-1, ck=crmOf(a.ids);
      a.crm=ck;
      var cids=[]; a.rows.forEach(function(r){ if(cids.indexOf(r.cid)<0) cids.push(r.cid); });
      var anyLive=a.rows.some(function(r){ return (D.adinfo[r.id]||{}).live; });
      var thumb=e.picture?'<img src="'+esc(e.picture)+'" referrerpolicy="no-referrer" alt="" data-thumb="'+ai+'" title="Open this ad" style="width:26px;height:26px;object-fit:cover;border-radius:5px;vertical-align:middle;margin-right:8px;cursor:zoom-in">':'<span data-thumb="'+ai+'" title="Open this ad" style="color:#94a3b8;margin-right:8px;cursor:zoom-in">▤</span>';
      rows+='<tr class="row l0'+(on?' on':'')+'" data-ax="'+ki+'">'+nm(caret(on)+dot(anyLive,e.status)+thumb,(e.name||'Ad')+(cids.length>1?'  ·  '+cids.length+' campaigns':''))+bcell(null)
        +cols({spend:a.spend,leads:a.results,res:a.results,clicks:a.clicks,impr:a.impressions,crm:ck||{}},null,!!ck)+'</tr>';
      if(!on) return;
      cids.sort(function(x,y){ return ((X.camp[y]||{}).spend||0)-((X.camp[x]||{}).spend||0); }).forEach(function(cid){
        var c=X.camp[cid]||{}, cc=crm.filter(function(x){ return x.cid===cid; }), ckey=a.k+'|'+cid, con=AX.camp===ckey, cki=R._axk.push(ckey)-1;
        var b=bud(c), bh=c.budget!=null&&c.live&&b==null?'<td>'+NA+'<div class="ssub">not spending</div></td>':!c.live?bcell(c.budget,esc(String(c.status||'stopped').toLowerCase())):bcell(b);
        var t=sum([c],cc); t.res=c.results;
        rows+='<tr class="row l1'+(con?' on':'')+'" data-axc="'+cki+'">'+nm(caret(con)+dot(c.live,c.status),c.name||'Campaign')+bh+cols(t,pl==='meta'&&!c.lead?false:null,cc.length>0)+'</tr>';
        if(!con) return;
        var sids=[]; a.rows.forEach(function(r){ if(r.cid===cid&&r.sid&&sids.indexOf(r.sid)<0) sids.push(r.sid); });
        if(!sids.length) rows+='<tr class="l2 none"><td colspan="16">No '+W.set.toLowerCase()+' recorded for this ad here</td></tr>';
        sids.forEach(function(sid){ var si=D.sets[sid]||{}, st=setTot(sid), sk=D.crmSet[sid];
          var sb=si.budget!=null?bcell(si.budget):c.budget!=null?'<td><span style="color:#64748b">'+money(c.budget)+'</span><div class="ssub">shared</div></td>':bcell(null);
          rows+='<tr class="l2"><td class="nm"><span class="nmx" title="'+esc(si.name||'')+'">'+dot(si.live,si.status)+esc(si.name||W.set)+'</span></td>'+sb+cols({spend:st.spend,leads:st.results,res:st.results,clicks:st.clicks,impr:st.impr,crm:sk||{}},null,!!sk)+'</tr>'; });
      });
    });
    var tot={spend:0,leads:null,clicks:0,impr:0}, allIds={};
    // 18 Nov 2026: Facebook results count in the Total only from lead / chat campaigns (reach, views and engagement of other
    // campaigns are not leads) - the same rule as everywhere else
    ads.forEach(function(a){ tot.spend+=a.spend; tot.clicks+=a.clicks; tot.impr+=a.impressions;
      a.rows.forEach(function(r){ if(r.results==null) return; if(pl==='meta'&&!(X.camp[r.cid]||{}).lead) return; tot.leads=(tot.leads||0)+r.results; });
      Object.keys(a.ids).forEach(function(k){ allIds[k]=1; }); });
    var tc=crmOf(allIds); tot.res=tot.leads;
    // 18 Nov 2026: the Total's CRM figures = the project's whole platform figure (as the row above in the projects table);
    // the leads not tied to an ad get a row of their own, so the rows add up
    var PT={leads:0,ql:0,sv:0,booked:0,lost:0}, K=['leads','ql','sv','booked','lost'];
    crm.filter(function(x){ return x.project===p&&x.pl===pl; }).forEach(function(x){ K.forEach(function(k){ PT[k]+=x[k]||0; }); });
    var UD={}, anyU=false; K.forEach(function(k){ UD[k]=Math.max(0,PT[k]-((tc||{})[k]||0)); if(UD[k]) anyU=true; });
    if(anyU&&ads.length) rows+='<tr class="l0"><td class="nm"><span class="nmx" style="font-style:italic">Not tied to an ad</span></td>'+bcell(null)+cols({spend:null,leads:null,clicks:null,impr:null,crm:UD},null,true)+'</tr>';
    tot.crm=PT;
    return '<div class="sec" id="below"><div style="padding:11px 14px;font-weight:700;font-size:13.5px;border-bottom:1px solid var(--line)"><span style="color:'+W.color+'">●</span> '+W.name+' · '+esc(p)+' <span style="font-weight:500;color:var(--slate);font-size:12px">- '+ads.length+' ad'+(ads.length===1?'':'s')+'; click one for the campaigns it runs in, then its '+W.sets.toLowerCase()+'</span></div>'
      +'<div style="overflow-x:auto"><table class="tbl"><thead>'+head('Ad',W.res,W.per)+'</thead><tbody>'+(rows||'<tr class="none"><td colspan="16" style="text-align:center;padding:18px">No ad ran here in this period for this choice</td></tr>')+'</tbody>'
      +(ads.length?'<tfoot><tr class="tot"><td>Total · '+ads.length+' ad'+(ads.length===1?'':'s')+'</td>'+bcell(null)+cols(tot,null,true)+'</tr></tfoot>':'')+'</table></div>'
      +(ads.length>S.axShow?'<div style="text-align:center;margin:14px 0"><button class="btn" data-axmore="1">Show more ('+S.axShow+' of '+ads.length+')</button></div>':'')+'</div>';
  }
  function section(C,crm){
    var p=S.open, pl=S.plat, W=PL[pl];
    var cs=C.filter(function(c){ return c.project===p&&c.pl===pl&&act(c); }).sort(function(a,b){ return b.spend-a.spend; });

      var t=sum([c],ck); t.res=c.results;

      var sets=Object.keys(g).filter(function(k){ var on=(D.sets[k]||{}).live; return S.st==='both'||(S.st==='active'?on:(!c.live||!on)); }).map(function(k){ return g[k]; }).sort(function(a,b){ return b.spend-a.spend; });

      sets.forEach(function(s){ var si=D.sets[s.sid]||{}, son=S.set===s.sid, sk=D.crmSet[s.sid];
        var sb=si.budget!=null?bcell(si.budget):c.budget!=null?'<td><span style="color:#64748b">'+money(c.budget)+'</span><div class="ssub">shared</div></td>':bcell(null);
        var st={spend:s.spend,leads:s.results,res:s.results,clicks:s.clicks,impr:s.impressions,crm:sk||{}};
        sec+='<tr class="row l1'+(son?' on':'')+'" data-set="'+esc(s.sid)+'">'+nm(caret(son)+dot(si.live,si.status),si.name||W.set)+sb+cols(st,null,!!sk)+'</tr>';
        if(!son) return;
        var ar=ads.filter(function(a){ return a.sid===s.sid&&act(a)&&ok(adLive(a)); }).sort(function(a,b){ return b.spend-a.spend; });
        if(!ar.length) sec+='<tr class="l2 none"><td colspan="16">No ad here for this choice</td></tr>';
        R._rows=R._rows||[];
        ar.forEach(function(a){ var ai=D.adinfo[a.id]||{}, ak=D.crmAd[a.id], ri=R._rows.push(a)-1;
          sec+='<tr class="row l2" data-row="'+ri+'">'+nm(dot(ai.live,ai.status),ai.name||'Ad')+bcell(null)+cols({spend:a.spend,leads:a.results,res:a.results,clicks:a.clicks,impr:a.impressions,crm:ak||{}},null,!!ak)+'</tr>'; });
      });
    });
    // CRM leads of this project and platform not tied to any of our campaigns (17 Nov 2026) - a row of their own
    var uk=crm.filter(function(x){ return x.untied&&x.project===p&&x.pl===pl; });
    if(uk.length){ var ut={spend:null,leads:null,clicks:null,impr:null,crm:{leads:0,ql:0,sv:0,booked:0,lost:0}}, by={};
      uk.forEach(function(x){ ['leads','ql','sv','booked','lost'].forEach(function(k){ ut.crm[k]+=x[k]||0; }); by[x.utype]=(by[x.utype]||0)+(x.leads||0); });
      sec+='<tr class="l0"><td class="nm"><span class="nmx" style="font-style:italic">Not tied to a campaign</span><div class="ssub">'+esc(Object.keys(by).sort(function(a,b){ return by[b]-by[a]; }).map(function(k){ return k+' '+by[k]; }).join(' · '))+'</div></td>'+bcell(null)+cols(ut,null,true)+'</tr>'; }
    var tot=sum(cs,crm.filter(function(x){ return x.project===p&&x.pl===pl; }));   // 18 Nov 2026: includes "Not tied to a campaign", as the row above does
    var html='<div class="sec" id="below"><div style="padding:11px 14px;font-weight:700;font-size:13.5px;border-bottom:1px solid var(--line)"><span style="color:'+W.color+'">●</span> '+W.name+' · '+esc(p)+' <span style="font-weight:500;color:var(--slate);font-size:12px">- '+cs.length+' campaign'+(cs.length===1?'':'s')+'; click one for its '+W.sets.toLowerCase()+'</span></div>'
      +'<div style="overflow-x:auto"><table class="tbl"><thead>'+head('Campaign',W.res,W.per)+'</thead><tbody>'+(sec||'<tr class="none"><td colspan="16" style="text-align:center;padding:18px">No campaign ran in this period</td></tr>')+'</tbody>'
      +(cs.length?'<tfoot><tr class="tot"><td>Total · '+cs.length+' campaign'+(cs.length===1?'':'s')+'</td>'+bcell(tot.bud)+cols(tot,null,true)+'</tr></tfoot>':'')+'</table></div>'

  function adCards(p,pl){
    var W=PL[pl], ids={}; D.camps.forEach(function(c){ if(c.project===p&&c.pl===pl) ids[c.id]=1; });
    var ads=D.adrows.filter(function(a){ return ids[a.cid]&&act(a)&&ok(adLive(a)); });
    if(S.camp) ads=ads.filter(function(a){ return a.cid===S.camp; });
    if(S.set) ads=ads.filter(function(a){ return a.sid===S.set; });
    else { var by={}, out=[]; ads.forEach(function(a){ var m=by[a.id]; if(!m){ by[a.id]=Object.assign({},a); out.push(by[a.id]); return; } m.spend+=a.spend; m.clicks+=a.clicks; m.impressions+=a.impressions; if(a.results!=null) m.results=(m.results||0)+a.results; }); ads=out; }
    ads.sort(function(a,b){ return b.spend-a.spend; });

    var h='<div class="ahead">Ads <span>- '+ads.length+' that ran in this period · '+esc(where)+'</span></div>';

    h+='<div class="ads">'+shown.map(function(a,i){ var e=D.adinfo[a.id]||{}, w=String(e.words||e.name||'Ad').split('\n'), c=D.crmAd[a.id];

      return '<div class="ad" data-card="'+i+'">'+pic+'<div class="an" title="'+esc(e.name)+'">'+esc(e.name||'Ad')+'</div><div style="padding:0 12px"><span class="tag '+(e.live?'t-on':'t-off')+'">'+(e.live?'Running':esc(String(e.status||'Stopped').charAt(0)+String(e.status||'stopped').slice(1).toLowerCase()))+'</span></div>'
        +'<div class="m"><span>Spend</span><b>'+money(a.spend)+'</b><span>'+W.res+'</span><b>'+n0(a.results)+'</b><span>CPR</span><b>'+money(a.results?a.spend/a.results:null)+'</b><span>CTR</span><b>'+pct(a.impressions?a.clicks/a.impressions*100:null)+'</b>'
        +'<span>CRM leads</span><b>'+(c?n0(c.leads):NA)+'</b><span>QL</span><b>'+(c?n0(c.ql):NA)+'</b><span>SV</span><b>'+(c?n0(c.sv):NA)+'</b><span>CPQL</span><b>'+(c&&c.ql?money(a.spend/c.ql):NA)+'</b></div></div>'; }).join('')+'</div>';
    if(ads.length>shown.length) h+='<div style="text-align:center;margin:14px 0"><button class="btn" data-more="1">Show more ('+shown.length+' of '+ads.length+')</button></div>';
    return h;
  }
  function showAd(a){
    var e=D.adinfo[a.id]||{}, c=X.camp[a.cid]||{}, s=a.sid?D.sets[a.sid]:null, W=PL[a.pl], w=String(e.words||'').split('\n').filter(Boolean), k=a.crm!==undefined?a.crm:D.crmAd[a.id];
    var media=e.youtube?'<div class="media" style="background:#000"><iframe src="https://www.youtube.com/embed/'+esc(e.youtube)+'?autoplay=1&mute=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>'
      :e.picture?'<div class="media" id="med"><img src="'+esc(e.picture)+'" referrerpolicy="no-referrer" alt=""></div>':'<div class="media" id="med" style="align-items:flex-start;justify-content:flex-start;background:#fff;padding:18px"><div style="color:#1a0dab;font-size:18px">'+esc(w[0]||e.name)+'</div></div>';
    var row=function(l,v){ return '<tr><td>'+l+'</td><td>'+v+'</td></tr>'; };
    document.getElementById('mod').innerHTML='<div class="mh"><h3><span style="color:'+W.color+'">●</span> '+esc(e.name||'Ad')+'</h3><button class="x" onclick="R.close()">×</button></div><div class="mb">'+media+'<div class="det">'
      +'<table>'+row('Campaign',esc(c.name||''))+(s?row(W.set,esc(s.name||'')):'')+'</table><div class="lbl">'+esc(dmy(D.from))+' – '+esc(dmy(D.to))+'</div><table>'
      +row('Spend',money(a.spend))+row(W.res,n0(a.results))+row('Cost per result',money(a.results?a.spend/a.results:null))+row('Impressions',n0(a.impressions))+row('Clicks',n0(a.clicks))+row('CTR',pct(a.impressions?a.clicks/a.impressions*100:null))
      +row('CRM leads',k?n0(k.leads):NA)+row('QL',k?n0(k.ql):NA)+row('SV',k?n0(k.sv):NA)+row('CPQL',k&&k.ql?money(a.spend/k.ql):NA)+'</table>'
      +(w.length&&(e.picture||e.youtube)?'<div class="lbl">Description</div><div class="words">'+esc(w.join('\n'))+'</div>':'')
      +'<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><span class="tag '+(e.live?'t-on':'t-off')+'">'+(e.live?'Active':'Inactive')+'</span> <span class="sub">'+W.name+'</span></div></div></div>';
    document.getElementById('ov').classList.add('show');
    if(a.pl==='meta') call({action:'video',ad_id:a.id}).then(function(v){ var m=document.getElementById('med'); if(m&&v&&v.iframe){ m.className='media tall'; m.style.cssText='background:#fff'; m.innerHTML='<iframe src="'+esc(v.iframe)+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>'; } }).catch(function(){});
  }
  app.addEventListener('click',function(e){ if(e.target.id!=='capply') return;

  app.addEventListener('click',function(e){
    var t=e.target.closest('[data-thumb],[data-tab],[data-ax],[data-axc],[data-axmore],[data-open],[data-plat],[data-camp],[data-set],[data-row],[data-card],[data-more]'); if(!t) return;

    else if(d.plat){ S.plat=S.plat===d.plat?null:d.plat; S.camp=null; S.set=null; S.show=12; R._scroll=true; }
    else if(d.camp){ S.camp=S.camp===d.camp?null:d.camp; S.set=null; S.show=12; }
    else if(d.set){ S.set=S.set===d.set?null:d.set; S.show=12; }

    else if(d.row!=null){ return; }   // opened by the listener below
    else if(d.card!=null){ showAd(R._cards[+d.card]); return; }
    paint();
  });
  // ad rows open the ad (their list is rebuilt on every paint, so it is read before anything else)
  app.addEventListener('click',function(e){ var t=e.target.closest('[data-row]'); if(t&&R._last) showAd(R._last[+t.dataset.row]); },true);
  var _paint=paint; paint=function(){ R._rows=[]; _paint(); R._last=R._rows; };
  window.addEventListener('hashchange',function(){ key=(location.hash.match(/k=([A-Za-z0-9]+)/)||[])[1]||''; D=null; load(); });
  var R={close:function(){ document.getElementById('ov').classList.remove('show'); document.getElementById('mod').innerHTML=''; }};
  load();
  return R;
})();
