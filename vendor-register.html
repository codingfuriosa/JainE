<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Vendor registration · The Jain Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1d24;--slate:#6b7280;--line:#e8e6e1;--bg:#f2efe9;--brand:#9c1420;--brand-dark:#7a0f19;--err:#b3261e;--ok:#166d4a}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px}
  .wrap{width:100%;max-width:820px}
  .head{background:#12141c;color:#fff;padding:30px 40px;border-radius:14px 14px 0 0;position:relative}
  .head:after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--brand)}
  .head b{font-size:20px;font-weight:800;letter-spacing:1.5px}
  .head div{color:#9aa0ad;font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;margin-top:6px}
  .card{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:36px 40px;box-shadow:0 1px 3px rgba(20,15,10,.04),0 12px 32px rgba(20,15,10,.06)}
  h1{font-size:23px;margin:0 0 10px;font-weight:700;letter-spacing:-.2px}
  p.sub{color:var(--slate);font-size:14px;margin:0 0 26px;line-height:1.6}
  h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin:30px 0 12px;padding-top:22px;border-top:1px solid var(--line)}
  h2:first-of-type{border-top:none;padding-top:0;margin-top:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .full{grid-column:1/-1}
  label.fld{display:block;font-size:12px;font-weight:600;color:var(--slate);margin:0 0 6px}
  label.fld .req{color:var(--brand)}
  input[type=text],input[type=tel],input[type=email],select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(156,20,32,.08)}
  .up{text-transform:uppercase}
  .row{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fcfbf9}
  .row .grid{grid-template-columns:repeat(4,1fr)}
  .row .rm{float:right;background:none;border:none;color:var(--slate);cursor:pointer;font-size:18px;line-height:1}
  .ck{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink);margin:8px 14px 0 0;cursor:pointer}
  .ck input{accent-color:var(--brand)}
  .inl{display:flex;flex-wrap:wrap}
  .groups{display:flex;flex-wrap:wrap;gap:6px 18px}
  .groups label{display:flex;gap:7px;align-items:center;font-size:13.5px;cursor:pointer}
  .groups input{accent-color:var(--brand)}
  .doc{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .doc .t{font-size:14px;font-weight:600}
  .doc .t small{display:block;font-weight:400;color:var(--slate);font-size:12px;margin-top:2px}
  .doc .st{font-size:13px;color:var(--slate)}
  .doc .st.ok{color:var(--ok);font-weight:600}
  .doc .st.bad{color:var(--err)}
  .doc input[type=file]{font-size:12.5px;max-width:240px}
  button.add{background:#fff;border:1px dashed #cfcac0;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--slate);cursor:pointer;font-family:inherit}
  button.add:hover{border-color:var(--brand);color:var(--brand)}
  button.btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:14px 28px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit}
  button.btn:hover:not(:disabled){background:var(--brand-dark)}
  button.btn:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--err);font-size:13.5px;margin:14px 0 0}
  .hint{color:var(--slate);font-size:12.5px;margin:4px 0 0}
  .center{text-align:center;padding:24px 0}
  .spin{border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;width:28px;height:28px;animation:sp .8s linear infinite;margin:0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ok-check{width:60px;height:60px;border-radius:50%;background:#e9f4ee;color:var(--ok);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  @media(max-width:640px){.card{padding:24px 18px}.head{padding:24px 20px}.grid,.row .grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><b>THE JAIN GROUP</b><div>Vendor registration</div></div>
  <div class="card" id="app"><div class="center"><div class="spin"></div></div></div>
</div>
<script src="vendor-register.js?v=20261004a"></script>
</body>
</html>
