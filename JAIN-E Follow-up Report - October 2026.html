<script>
const D={"q": [[720525, "NANHE KUMAR", "Dream Eco City", "Nabanita Seet", "2026-10-11", "asked to share details of 3bhk .., lives at asansol will get back", "The customer, currently residing in Asansol, expressed interest in a 3BHK flat at Dream Eco City, Durgapur, and confirmed that their budget is sufficient for the project's offering. The agent provided accurate information about the project, answered all queries, and agreed to send details via WhatsApp, but did not explicitly ask for a site visit or callback. The CRM status of 'In Follow Up' is incorrect, as the customer is fully qualified on all four gates. The lead should be marked as Qualified, with no site visit pending at this stage."], [723118, "Nishant Tripathi", "Dream Eco City", "Sanchali Dasgupta", "2026-10-22", "initially looking for bungalows but his budget is 45 lakhs so discussed about flats.... if he is interested then he will decide for a site visit... dis and shared whatsapp details", "The customer initially wanted a bungalow but found the price (86 lakh) above his 40-45 lakh budget. The agent then accurately pitched ready-to-move flats in Dream Eco City that fit the customer's budget and requirements, shared details via WhatsApp, and said a site visit could be arranged if the customer was interested. All project facts were presented accurately, and the agent was polite and responsive. However, the CRM status is 'In Follow Up' when the lead is actually qualified and visit-pending, as all four qualification gates are met. The CRM remarks accurately reflect the conversation. The lead should be marked as Qualified (Visit Pending), not just In Follow Up."], [723121, "+919681811811 - Connected", "Dream Eco City", "Sreyoshee Mukherjee", "2026-10-22", "he will get back", "The customer inquired about available 3BHK units in Dream Eco City, Durgapur, and received accurate information on price, area, and availability. The agent also provided correct details about other Jain Group projects in Kolkata and Madhyamgram. The customer did not express any objections or mismatches and indicated he would get back after considering the information. The agent did not propose a site visit or callback, missing the call-to-action step. The CRM remarks accurately reflect the conversation, but the CRM status should be Qualified, as the customer's requirements match the project's offering on all four qualification gates. No personal mobile number was requested. The lead should be moved to Qualified."], [718237, "Gautam Parida", "Dream Exotica", "Sanchali Dasgupta", "2026-10-01", "looking for 2bhk... his budget is 40-50 lakhs... he is loking for ready to move property... so dis full details and shared whatsapp details...  asked to call tomorrow for further updation", "The customer is looking for a ready-to-move 2BHK property in the 40-50 lakh range. The agent correctly identified Dream Exotica as matching these requirements, provided accurate details, and agreed to share the brochure and location via WhatsApp. A callback was scheduled for the next day to discuss further and potentially arrange a site visit. The CRM's status of 'In Follow Up' is incorrect; the lead should be marked as 'Qualified (Visit Pending)' since all qualification gates are met and the customer is interested in proceeding. No personal mobile number was requested. The agent handled the call well, following the script and addressing all queries accurately."], [718974, "Diksha Pathak", "Dream Exotica", "Meghadeepa Mitra", "2026-10-05", "she stay rajarhat , discuss 2 and 3bhk, sent details discuss with her husband then she decided", "The customer was looking for a 3BHK in Dream Exotica and confirmed that the location (Madhyamgram, Badu Road) was comfortable for her. The agent provided accurate information about available configurations, area, price, and amenities, and answered all queries, including location and loan availability. The customer said she would discuss with her husband and the agent proposed a callback o personal mobile number was requested. The lead should be moved to Qualified (Visit Pending) and followed up after Puja as agreed."], [723476, "+917353164888 - Connected", "Dream Exotica", "Nabanita Seet", "2026-10-23", "will plan after 6months,, need 2bhk", "The customer inquired about the location, availability, and price of a 2BHK at Dream Exotica. The agent provided accurate and complete information, confirming that only one 2BHK is available at 45 lakh, ready to move. The customer stated she cannot plan a visit or booking for six months due to a family illness but is interested in a 2BHK only. The CRM remarks accurately reflect the conversation, but the CRM status should be Qualified, as all four qualification gates are met and the customer is interested in proceeding when her situation allows. No personal mobile number was requested."], [723598, "Swarup Dutta", "Dream Exotica", "Sanchali Dasgupta", "2026-10-24", "2BHK.... dis full details and shared whatsapp details... he will call back for site visit... he stays near Madhyamgram location", "The customer enquired about a 2BHK in Dream Exotica, confirming interest in a ready-to-move property in Madhyamgram with a budget of 40 lakh. The agent provided accurate details about the project, price, and availability, and agreed to share the brochure via WhatsApp. The customer said he would review and call back for a site visit, and the agent proposed a follow-up call on Monday, which the customer accepted. The CRM remarks accurately reflect the conversation, but the CRM status of 'In Follow Up' is a mismatch: the customer meets all qualification gates and is interested in a site visit, so the lead should be marked as Qualified with a visit pending. No personal mobile number was requested."], [723931, "Ali", "Dream Exotica", "Sanchali Dasgupta", "2026-10-25", "looking for 1BHK.... but since 1bhk is not available in Gurukul and his budget is also low so dis full details of Exotica and shared whatsapp details... asked to call back on next month begiinning... he will call back for site visit if he is interested", "The customer wanted a 1BHK in Madhyamgram, but the agent explained that only a 1RK is available in Dream Exotica and provided all relevant details, including price, area, and location. The customer expressed comfort with the price and interest in visiting the site, and both parties agreed to reconnect at the beginning of the next month to schedule a visit. The CRM accurately recorded the conversation details but incorrectly left the lead as In Follow Up; the customer met all qualification gates and should have been marked as Qualified with a visit pending. No personal mobile number was requested."], [717677, "Sayantan Saha", "Dream Gurukul", "Meghadeepa Mitra", "2026-10-25", "sent details call again 2 days later", "The customer inquired about Dream Gurukul, specifically asking about the location, 3BHK price, area, and parking. The agent provided accurate and complete information, confirmed the customer's requirements, and discussed the possibility of a site visit after the upcoming Puja. The customer requested a callback in three-four days and indicated they would review details sent via WhatsApp before confirming a visit. The CRM's status of 'In Follow Up' is incorrect; the lead is fully qualified and should be marked as 'Qualified (Visit Pending)'. The agent handled the call well, followed the script, and addressed all queries appropriately."], [718613, "gour mohan", "Dream Gurukul", "Nabanita Seet", "2026-10-03", "gurukul 3bhk discussed price informed,,, he is at delhi now,, said will visit next week ..due to some network issues & as he was driving said will call back in sometime,,", "The customer enquired about Dream Gurukul, specifically a 2BHK, and the agent provided accurate information on price, area, and possession. The customer, currently in Delhi, said he would visit the site next week. The call ended due to the customer driving and asking to call back. The CRM 33, "Debjit Roy", "Dream Gurukul", "Jayeeta Deb", "2026-10-22", "after hearing all details 3bhk and budget he said 1st he check this details if comfortable then get back us..he is from Maharashtra.", "The customer, based in Maharashtra, enquired about a 3BHK in Dream Gurukul for long-term investment. The agent provided accurate and complete project details, including configuration, area, price, location, and possession timeline. The customer indicated comfort with the under-construction status and price range, and is open to sending a local representative for a site visit. The agent set a follow-up call for the next day and will send project details via WhatsApp. The CRM currently lists the lead as 'In Follow Up', but all qualification gates are met and a visit is pending, so the lead should be marked as Qualified. No personal mobile number was requested. The agent handled the call professionally and followed the correct process."], [722632, "Sayantika Dhara Dey", "Dream Gurukul", "Meghadeepa Mitra", "2026-10-22", "sent details discuss then she decided", "The customer enquired about Dream Gurukul, seeking a 2-3BHK in the project's location. The agent provided accurate and complete information about configuration, area, price, location, and possession, and answered the customer's queries directly. The customer indicated she would discuss with her family and then decide, and the agent agreed to send details and follow up, offering to arrange a site visit if the customer is interested. All qualification gates are met, and the customer expressed intent to proceed, so the lead should be marked as Qualified (visit pending). The CRM currently lists the lead as In Follow Up, which is a mismatch. No personal mobile number was requested."], [723046, "Rajesh K Roy", "Dream Gurukul", "Sanchali Dasgupta", "2026-10-22", "2BHK.... dis full details and shared whatsapp details... he is in Bangalore now... he will be coming to kolkata by December... unable to qualify now...", "The customer enquired about a 2BHK in Dream Gurukul, asking for price and area, and confirmed their budget and interest in the project. The agent provided accurate and complete information, handled all queries well, and established that the customer is currently in Bangalore and will be in Kolkata after December. A follow-up was agreed for after December 10th, with details shared via WhatsApp. All four qualification gates are met and a site visit is pending, so the lead should be marked as Qualified (Visit Pending), not just In Follow Up. The CRM's remarks are accurate, but the status should be updated to reflect the customer's qualification and pending visit."], [723392, "Rajib Banerjee", "Dream Gurukul", "Meghadeepa Mitra", "2026-10-23", "he interested nearest airport location , now driving so call evening sent details", "The customer, Rajib Banerjee, expressed interest in a project near the airport (Madhyamgram) and specifically wanted a 3BHK. The agent correctly identified Dream Gurukul as the matching project, confirmed the configuration and price, and established that the customer was comfortable with the under-construction status and the quoted price. The customer was driving and requested details via WhatsApp, and a callback was scheduled for the same evening. The CRM status of 'In Follow Up' is too conservative, as the customer has already met the qualification gates for location, configuration, budget, and position. The lead should be marked as Qualified, not just In Follow Up. No personal mobile number was requested. The agent handled the call well, following the script and personalizing the pitch to the customer's requirements."], [719632, "Nigamananda Swain", "Dream One", "Jayeeta Deb", "2026-10-07", "after hearing 2bhk and budget..his budget 1.2 cr but he said 1st he check this details and location if comfortable then he inform me after 2days..he is from odisha", "The customer, from Odisha, is seeking a 2BHK flat in Kolkata, preferably in New Town or Salt Lake, with a budget up to 1.2 crore and area around 800-900 sqft. The agent correctly identified the requirement, provided accurate project details for Dream One, and quoted the correct price and area. The customer requested a brochure and stated he would visit in November, asking for a follow-up call after two days. The CRM status of 'In Follow Up' is incorrect; the lead is fully qualified with a site visit pending. The agent handled the call professionally, followed the script, and addressed all queries. No personal mobile number was requested."], [719886, "Arindom Bose", "Dream Residency Manor", "Meghadeepa Mitra", "2026-10-08", "he interested rajarhat project , discuss manor 2bhk , he said sent details then he decided", "The customer enquired about projects in Rajarhat or New Town, and the agent accurately redirected from Dream World City and Dream One to Dream Residency Manor, providing all correct details: 2BHK, 1115 sqft, 63 lakh, ready-to-move, only one unit left. The customer requested a brochure and said they would decide after reviewing, mentioning they are often out of town for work but open to a site visit when in Kolkata. The agent handled the call professionally, answered all queries, and invited the customer for a visit. The CRM remarks accurately reflect the conversation, but the status should be Qualified (visit pending), not just In Follow Up, as all qualification gates are met and the customer is interested in proceeding. No personal mobile number was requested."], [719114, "P.R", "Dream Valley", "Sreyoshee Mukherjee", "2026-10-05", "he wants details", "The customer inquired about Dream Valley, specifically asking about ready-to-move 3BHK flats, their area, and price. The agent provided accurate information, clarified that only ready flats are available (not land or custom construction), and invited the customer for a site visit. The customer requested details to be sent via WhatsApp and agreed to review them, indicating clear interest and qualification. The CRM status of 'In Follow Up' does not reflect that the lead is now qualified with a site visit pending; it should be updated to 'Qualified (Visit Pending)'. No personal mobile number was requested."], [675817, "Rehman", "Dream World City", "Susmita Sarkar", "2026-10-08", "2bhk , stay at barrabazar , wants to visit sunday , sat call to confirm", "The customer enquired about a 2BHK in Dream World City, asking about price, area, ready-to-move status, and location. The agent answered all questions accurately, confirmed the project is ready to move, and provided correct pricing and area details. The customer, calling from Bada Bazar, expressed interest in visiting the site on Sunday, and the agent agreed to send details and confirm the visit on Saturday. The CRM remarks accurately reflect the conversation, and the follow-up date is correctly set for the day before the planned visit. However, the CRM status is 'In Follow Up' when the customer has clearly qualified by expressing intent to visit and matching all requirements; the lead should be marked as Qualified (Visit Pending). No personal mobile number was requested. The agent handled the call well, following the script, answering queries, and personalizing the interaction."], [681801, "Julee Singh", "Dream World City", "Nabanita Seet", "2026-10-01", "discussed 3bhk then said will call back", "The customer confirmed her requirement for a 3BHK flat in Dream World City, Joka, and the agent provided accurate information about price, area, location, and possession. The customer indicated she was busy and would call back, but did not express any objection or disqualifying factor. All qualification gates were met, so the lead should be marked as Qualified, not In Follow Up. The agent was polite and followed the script, but did not ask for a site visit or propose a callback time. No personal mobile number was requested. The CRM remarks accurately reflect the call, but the status should be updated to Qualified with a const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=d=>{if(!d)return '';const p=String(d).split('-');return +p[2]+' '+MON[+p[1]-1];};
const fmtN=n=>Number(n).toLocaleString();

/* Each section: which raw date decides whether a row is in the picked range, and how raw rows become
   table rows. Late follow-ups roll up to one row per lead, listing every late follow-up it had. */
const SECTIONS=[
  {id:'q',title:'Should be Qualified',color:'var(--q)',dateIdx:4,
   sub:'Latest CRM status is still In Follow Up, but the AI judged the call as Qualified. One row per lead (its latest flagged call in range).',
   cols:['Lead ID','Lead name','Project','Agent','Call date','Flagged calls','CRM remarks','AI verdict'],wide:[6,7],num:5,
   build(rows){const by=new Map();rows.forEach(r=>{const g=by.get(r[0]);if(!g)by.set(r[0],{r,n:1});else{g.n++;if(r[4]>g.r[4])g.r=r;}});
     return [...by.values()].sort((a,b)=>b.r[4].localeCompare(a.r[4])||a.r[0]-b.r[0]).map(g=>[g.r[0],g.r[1],g.r[2],g.r[3],fmt(g.r[4]),g.n,g.r[5],g.r[6]]);}},
  {id:'l',title:'Late follow-ups',color:'var(--l)',dateIdx:5,
   sub:'Agent promised a follow-up date and called after it. One row per lead; every late follow-up of that lead is listed. Range filters on the promised date.',
   cols:['Lead ID','Lead name','Project','Agent(s)','Late follow-ups','Each late follow-up (promised → called)','Max days late','Lead status'],num:4,det:5,
   build(rows){const by=new Map();rows.forEach(r=>{let g=by.get(r[0]);if(!g)by.set(r[0],g={r,items:[],agents:new Set()});g.items.push(r);g.agents.add(r[3]||'-');});
     return [...by.values()].map(g=>{g.items.sort((a,b)=>a[5].localeCompare(b[5]));
       return [g.r[0],g.r[1],g.r[2],[...g.agents].sort().join(', '),g.items.length,
         g.items.map(x=>`${fmt(x[5])} → ${fmt(x[6])} (${x[7]} day${x[7]===1?'':'s'} late${g.agents.size>1?', '+x[3]:''})`),
         Math.max(...g.items.map(x=>x[7])),g.r[8]];}).sort((a,b)=>b[4]-a[4]||b[6]-a[6]||a[0]-b[0]);}},
  {id:'n',title:'Not receiving the call, callback after 7+ days',color:'var(--n)',dateIdx:4,
   sub:'Remark "Not receiving the call", and the next call to that lead came more than 7 days later.',
   cols:['Lead ID','Lead name','Project','Agent','Not-received on','Called back on','Days gap','Lead status','Callback remark'],wide:[8],num:6,
   build(rows){return rows.slice().sort((a,b)=>b[6]-a[6]||a[0]-b[0]).map(r=>[r[0],r[1],r[2],r[3],fmt(r[4]),fmt(r[5]),r[6],r[7],r[8]]);}},
  {id:'x',title:'Not connected, no follow-up in 7 days',color:'var(--l)',dateIdx:4,
   sub:'Call was not connected (not receiving, switched off, not reachable, busy, auto not-connected) and the lead got no follow-up call within the next 7 days. Calls up to 18 Oct only, so every call has had its full 7 days. Leads since marked Lost are left out. Range filters on the not-connected call date; Level 2 = Rani, Piyasa, Susmita, everyone else is Level 1.',
   cols:['Lead ID','Lead name','Project','Agent','Level','Missed follow-ups','Each not-connected call (remark → next call)','Lead status'],num:5,det:6,
   build(rows){const by=new Map();rows.forEach(r=>{const k=r[0]+'|'+r[3];let g=by.get(k);if(!g)by.set(k,g={r,items:[]});g.items.push(r);});
     return [...by.values()].map(g=>{g.items.sort((a,b)=>a[4].localeCompare(b[4]));
       return [g.r[0],g.r[1],g.r[2],g.r[3],levelOf(g.r[3]),g.items.length,
         g.items.map(x=>`${fmt(x[4])} - ${x[5]} → ${x[7]?'next call '+fmt(x[7])+' (after 7+ days)':'no call since'}`),g.r[6]];}).sort((a,b)=>b[5]-a[5]||a[0]-b[0]);}}
];
const LEVEL2=['rani das','piyasa guha','susmita sarkar'];
function levelOf(a){return LEVEL2.includes(String(a||'').trim().toLowerCase())?'Level 2':'Level 1';}
let cur='l',sortCol=null,sortDir=1,view={};

function inRange(s){const f=$('from').value||'0000',t=$('to').value||'9999';return D[s.id].filter(r=>r[s.dateIdx]>=f&&r[s.dateIdx]<=t);}
function recompute(){
  SECTIONS.forEach(s=>{const raw=inRange(s);view[s.id]={raw,rows:s.build(raw)};});
  const f=$('from').value,t=$('to').value;
  $('rangeNote').textContent=`Showing ${fmt(f)} – ${fmt(t)} 2026`;
  $('cards').innerHTML=SECTIONS.map(s=>{const v=view[s.id],leads=v.rows.length;
    let extra='';
    if(s.id==='l'){const c=[0,0,0,0];v.rows.forEach(r=>c[Math.min(r[4],4)-1]++);
      extra=`<div class="dist">${['1 late follow-up','2 late follow-ups','3 late follow-ups','4 or more'].map((l,i)=>`<span><b>${fmtN(c[i])}</b> ${c[i]===1?'lead':'leads'} with ${l}</span>`).join('')}</div>`;}
    const ent=s.id==='l'?`${fmtN(v.raw.length)} late follow-ups across these leads`:s.id==='q'?`${fmtN(v.raw.length)} flagged calls`:s.id==='x'?`${fmtN(v.raw.length)} not-connected calls with no follow-up; Level 1: ${fmtN(v.rows.filter(r=>r[4]==='Level 1').length)} leads, Level 2: ${fmtN(v.rows.filter(r=>r[4]==='Level 2').length)} leads`:`${fmtN(v.raw.length)} calls`;
    return `<div class="card" style="--c:${s.color}" data-id="${s.id}"><div class="n">${fmtN(leads)} <small>leads</small></div><div class="t">${esc(s.title)}</div><div class="s">${ent}</div>${extra}</div>`;}).join('');
  const agents={};
  SECTIONS.forEach((s,i)=>{if(s.id==='x')return;const seen=new Set();view[s.id].raw.forEach(r=>{const k=(r[3]||'-')+'|'+r[0];if(seen.has(k))return;seen.add(k);(agents[r[3]||'-']=agents[r[3]||'-']||[0,0,0,0])[i]++;});});
  view.l.raw.forEach(r=>{(agents[r[3]||'-']=agents[r[3]||'-']||[0,0,0,0])[3]++;});
  const xs=new Set();view.x.raw.forEach(r=>{const k=(r[3]||'-')+'|'+r[0];if(xs.has(k))return;xs.add(k);(agents[r[3]||'-']=agents[r[3]||'-']||[0,0,0,0])[4]=(agents[r[3]||'-'][4]||0)+1;});
  const ar=Object.entries(agents).sort((a,b)=>(b[1][0]+b[1][1]+b[1][2])-(a[1][0]+a[1][1]+a[1][2]));
  $('agent').innerHTML='<tr><th class="sl">Sl No</th><th>Agent</th><th>Should be Qualified</th><th>Late follow-ups (leads)</th><th>Not receiving, callback 7+ days</th><th>Late follow-ups (count)</th><th>Level</th><th>Not connected, no follow-up 7d</th></tr>'
    +ar.map(([a,v],i)=>`<tr><td class="sl">${i+1}</td><td>${esc(a)}</td><td>${fmtN(v[0])}</td><td>${fmtN(v[1])}</td><td>${fmtN(v[2])}</td><td>${fmtN(v[3])}</td><td>${levelOf(a)}</td><td>${fmtN(v[4]||0)}</td></tr>`).join('')
    +`<tr class="tot"><td class="sl"></td><td>Total (unique leads)</td><td>${fmtN(view.q.rows.length)}</td><td>${fmtN(view.l.rows.length)}</td><td>${fmtN(view.n.rows.length)}</td><td>${fmtN(view.l.raw.length)}</td><td></td><td>${fmtN(view.x.rows.length)}</td></tr>`;
  $('tabs').innerHTML=SECTIONS.map(s=>`<button class="tab" data-id="${s.id}">${esc(s.title)} (${fmtN(view[s.id].rows.length)} leads)</button>`).join('');
  document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{cur=el.dataset.id;sortCol=null;$('q').value='';$('ag').value='';$('lv').value='';render();if(el.classList.contains('card'))$('tabs').scrollIntoView({behavior:'smooth'});});
  render();
}
function sec(){return SECTIONS.find(s=>s.id===cur);}
function rows(){
  const s=sec(),t=$('q').value.trim().toLowerCase(),a=$('ag').value;
  const lv=cur==='x'?$('lv').value:'';
  let r=view[cur].rows.filter(x=>(!lv||x[4]==='Level '+lv)&&(!a||String(x[3]).split(', ').includes(a))&&(!t||x.flat().join(' ').toLowerCase().includes(t)));
  if(sortCol!==null)r=r.slice().sort((x,y)=>{const p=x[sortCol],q=y[sortCol];return (typeof p==='number'&&typeof q==='number'?p-q:String(p??'').localeCompare(String(q??'')))*sortDir;});
  return r;
}
function render(){
  const s=sec();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.id===cur));
  $('sub').textContent=s.sub;$('lv').style.display=cur==='x'?'':'none';
  const agents=[...new Set(view[cur].rows.flatMap(r=>String(r[3]||'').split(', ')).filter(Boolean))].sort(),keep=$('ag').value;
  $('ag').innerHTML='<option value="">All agents</option>'+agents.map(a=>`<option${a===keep?' selected':''}>${esc(a)}</option>`).join('');
  const r=rows();
  $('count').textContent=`${fmtN(r.length)} leads`+(cur==='l'?`, ${fmtN(r.reduce((a,x)=>a+x[4],0))} late follow-ups`:cur==='x'?`, ${fmtN(r.reduce((a,x)=>a+x[5],0))} missed follow-ups`:'');
  $('tbl').innerHTML='<tr><th class="sl">Sl No</th>'+s.cols.map((c,i)=>`<th data-c="${i}">${esc(c)}${sortCol===i?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>'+
    r.map((x,n)=>`<tr><td class="sl">${n+1}</td>`+x.map((v,i)=>{
      if(i===s.det)return `<td class="det">${v.map(l=>`<div>${esc(l)}</div>`).join('')}</td>`;
      const hot=(cur==='l'&&i===6&&v>=7)||(cur==='n'&&i===6&&v>=14);
      const cls=i===0?'id':(i===s.num||(cur==='l'&&i===6))?('num'+(hot?' hot':'')):(s.wide||[]).includes(i)?'w':'';
      return `<td class="${cls}">${esc(v)}</td>`;}).join('')+'</tr>').join('');
  $('tbl').querySelectorAll('th[data-c]').forEach(th=>th.onclick=()=>{const c=+th.dataset.c;sortDir=sortCol===c?-sortDir:1;sortCol=c;render();});
}
$('q').oninput=render;$('ag').onchange=render;$('lv').onchange=render;
$('from').onchange=$('to').onchange=()=>{if($('from').value>$('to').value)$('to').value=$('from').value;recompute();};
$('reset').onclick=()=>{$('from').value='2026-10-01';$('to').value='2026-10-25';recompute();};
$('csv').onclick=()=>{
  const s=sec(),q=v=>'"'+String(Array.isArray(v)?v.join('; '):v??'').replace(/"/g,'""')+'"';
  const txt='﻿'+[['Sl No',...s.cols],...rows().map((r,i)=>[i+1,...r])].map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));
  a.download=`JAIN-E ${$('from').value} to ${$('to').value} - ${s.title}.csv`;a.click();
};
recompute();
</script>
