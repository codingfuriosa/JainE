<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback · The Jain Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1d24;--slate:#6b7280;--line:#e8e6e1;--bg:#f2efe9;--brand:#9c1420;--brand-dark:#7a0f19;--gold:#b8860b;--err:#b3261e;--ok:#166d4a}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:48px 20px}
  .wrap{width:100%;max-width:760px}
  .head{background:#12141c;color:#fff;padding:34px 44px;border-radius:14px 14px 0 0;position:relative}
  .head:after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--brand)}
  .head b{font-size:20px;font-weight:800;letter-spacing:1.5px}
  .head div{color:#9aa0ad;font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;margin-top:6px}
  .card{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:44px;box-shadow:0 1px 3px rgba(20,15,10,.04),0 12px 32px rgba(20,15,10,.06)}
  h1{font-size:23px;margin:0 0 10px;font-weight:700;letter-spacing:-.2px}
  p.sub{color:var(--slate);font-size:14px;margin:0 0 30px;line-height:1.6}
  .q{border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:16px;transition:border-color .15s}
  .q.q-err{border-color:var(--err);border-left:3px solid var(--err);padding-left:22px}
  .q .prompt{font-size:15px;line-height:1.55;margin-bottom:16px;white-space:pre-wrap;font-weight:600;color:var(--ink)}
  .q .qnum{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--brand);color:var(--brand);font-size:11px;font-weight:700;margin-right:10px;vertical-align:2px}
  .q .req{color:var(--brand);margin-left:3px}
  .q .opt-tag{margin-left:8px;font-size:10.5px;font-weight:600;color:var(--slate);background:#f4f2ed;padding:3px 8px;border-radius:20px;vertical-align:2px;text-transform:uppercase;letter-spacing:.4px}
  .q-err-msg{display:none;align-items:center;gap:6px;color:var(--err);font-size:12.5px;font-weight:600;margin-top:10px}
  .opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;cursor:pointer;transition:border-color .15s,background .15s}
  .opt:hover{background:#faf9f6;border-color:#d8d4cb}
  .opt input{accent-color:var(--brand)}
  .stars{display:flex;gap:2px;margin:0 -8px}
  .stars .star{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;font-size:27px;line-height:1;color:#e2dfd7;cursor:pointer;border-radius:10px;user-select:none;transition:color .1s}
  .stars .star:hover{background:#faf9f6}
  .stars .star:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;background:#faf9f6}
  .stars .star.on{color:var(--gold)}
  .star-readout{font-size:12.5px;color:var(--slate);margin-top:4px}
  textarea,input[type=text],input[type=tel],input[type=email]{width:100%;min-height:auto;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-family:inherit;font-size:14px;resize:vertical;background:#fff}
  textarea:focus,input[type=text]:focus,input[type=tel]:focus,input[type=email]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(156,20,32,.08)}
  textarea{min-height:96px}
  label.fld{display:block;font-size:12px;font-weight:600;color:var(--slate);margin:0 0 7px;letter-spacing:.2px}
  .contact{margin-bottom:16px}
  button.btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:14px 26px;font-size:14.5px;font-weight:700;cursor:pointer;letter-spacing:.2px;transition:background .15s}
  button.btn:hover:not(:disabled){background:var(--brand-dark)}
  button.btn:disabled{opacity:.5;cursor:not-allowed}
  .center{text-align:center;padding:20px 0}
  .spin{border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;width:28px;height:28px;animation:sp 0.8s linear infinite;margin:0 auto}
  .btn-spin{display:inline-block;vertical-align:-3px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;width:14px;height:14px;animation:sp 0.7s linear infinite;margin-right:4px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{color:var(--err);font-size:13.5px}
  .ok-check{width:60px;height:60px;border-radius:50%;background:#e9f4ee;color:var(--ok);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto}
  .ok-msg{color:var(--ok);font-size:16px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><b>THE JAIN GROUP</b><div>Feedback</div></div>
  <div class="card" id="app"><div class="center"><div class="spin"></div></div></div>
</div>
<script src="feedback-fill.js"></script>
</body>
</html>
